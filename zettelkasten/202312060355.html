        <h1>Fixed Costs</h1>
<p><em>Fixed costs</em> are costs that don't change throughout the lifecycle of a project. They are usually paid up-front.  </p>
<h2>Examples</h2>
<ul>
<li>setup costs</li>
<li>rental costs</li>
<li>insurance premiums</li>
<li>property taxes</li>
</ul>
