        <h1>S3 Encryption</h1>
<p>By default, Amazon S3 encrypts object data on the server-side, <em>after</em> the object has arrived in the bucket. The client is responsible for encrypting the file <em>before</em> uploading it.   </p>
<h2>References</h2>
<p><a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingEncryption.html">Amazon S3 User Guide - Protecting data with encryption</a></p>
